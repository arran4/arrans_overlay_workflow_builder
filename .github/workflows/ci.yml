name: CI/CD
on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
      - v*.*.*
      - v*.*.*-rc*
      - v*.*.*-beta*
      - test-*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    branches:
      - main
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: lint-fix
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
          - publish-tag
      release_version_override:
        type: string
        default: ''
      allow_prs:
        type: boolean
        default: true
  schedule:
    - cron: 17 3 1 * *
    - cron: 41 2 * * *
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number
    || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  checks: write
  packages: write
  security-events: write
jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_pr_meta_checks: ${{ steps.route.outputs.run_pr_meta_checks }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
      run_release: ${{ steps.route.outputs.run_release }}
      is_monthly: ${{ steps.route.outputs.is_monthly }}
      is_nightly: ${{ steps.route.outputs.is_nightly }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail
          run_code_checks=false
          run_pr_meta_checks=false
          run_cleanup=false
          run_release=false
          is_monthly=false
          is_nightly=false
          case "${{ github.event_name }}" in
            push)
              run_code_checks=true
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                run_release=true
              fi
              ;;
            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                run_cleanup=true
              else
                run_pr_meta_checks=true
                run_code_checks=true
              fi
              ;;
            release)
              # Downstream notification only. Never create the same release again here.
              ;;
            workflow_dispatch)
              run_code_checks=true
              if [[ "${{ inputs.mode }}" == release-* || "${{ inputs.mode }}" == "publish-tag" ]]; then
                run_release=true
              fi
              if [[ "${{ inputs.mode }}" == "monthly-maintenance" ]]; then
                is_monthly=true
              fi
              if [[ "${{ inputs.mode }}" == "lint-fix" ]]; then
                is_nightly=true
              fi
              ;;
            schedule)
              run_code_checks=true
              if [[ "${{ github.event.schedule }}" == "17 3 1 * *" ]]; then
                is_monthly=true
              fi
              if [[ "${{ github.event.schedule }}" == "41 2 * * *" ]]; then
                is_nightly=true
              fi
              ;;
          esac
          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_pr_meta_checks=$run_pr_meta_checks" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "is_monthly=$is_monthly" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"
  prepare-release-tag:
    name: Prepare release tag
    needs: [route]
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'release-') }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      next_version: ${{ steps.tag.outputs.next_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup git-tag-inc
        uses: arran4/git-tag-inc-action@v1.2
        with:
          mode: install
      - id: tag
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.mode }}"
          OVERRIDE="${{ inputs.release_version_override }}"

          git fetch --tags --force

          if [[ -n "$OVERRIDE" ]]; then
            OVERRIDE="${OVERRIDE#v}"
            next_tag="v$OVERRIDE"
          else
            case "$MODE" in
              release-major) level="major"; suffix="" ;;
              release-minor) level="minor"; suffix="" ;;
              release-patch) level="patch"; suffix="" ;;
              release-test)  level="patch"; suffix="test" ;;
              release-rc)    level="patch"; suffix="rc" ;;
              release-alpha) level="patch"; suffix="alpha" ;;
              *) echo "Unsupported release mode: $MODE" >&2; exit 1 ;;
            esac

            if command -v git-tag-inc >/dev/null 2>&1; then
              level="${level#-}"
              args=(-print-version-only "$level")
              [[ -n "$suffix" ]] && args+=("$suffix")
              next_tag=$(git-tag-inc "${args[@]}")
            else
              latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)
              [[ -z "$latest" ]] && latest='0.0.0'
              if command -v npx >/dev/null 2>&1; then
                case "$level" in
                  major) bumped=$(npx --yes semver "$latest" -i major) ;;
                  minor) bumped=$(npx --yes semver "$latest" -i minor) ;;
                  *) bumped=$(npx --yes semver "$latest" -i patch) ;;
                esac
                next_tag="v${bumped}"
              else
                base="${latest%%-*}"
                IFS='.' read -r maj min pat <<< "$base"
                case "$level" in
                  major) maj=$((maj+1)); min=0; pat=0 ;;
                  minor) min=$((min+1)); pat=0 ;;
                  *) pat=$((pat+1)) ;;
                esac
                next_tag="v${maj}.${min}.${pat}"
              fi
              if [[ -n "$suffix" ]]; then
                next_tag="${next_tag}-${suffix}.1"
              fi
            fi
          fi

          [[ "$next_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "Invalid tag format: $next_tag" >&2
            exit 1
          }

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$next_tag" | awk '{print $1}')
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $next_tag exists and points to GITHUB_SHA. Safe to retry."
            else
              echo "Tag already exists and points to $REMOTE_TAG_SHA (expected ${GITHUB_SHA}): $next_tag" >&2
              echo "To retry a failed publication for this exact version, ensure release_version_override is used and GITHUB_SHA matches." >&2
              exit 1
            fi
          fi

          echo "release_tag=$next_tag" >> "$GITHUB_OUTPUT"

          clean_tag="${next_tag#v}"
          clean_tag="${clean_tag%%-*}"
          IFS='.' read -r maj min pat <<< "$clean_tag"
          echo "next_version=${maj:-0}.${min:-0}.$(( ${pat:-0} + 1 ))-SNAPSHOT" >> "$GITHUB_OUTPUT"

  release-context:
    name: Release Context & Gate
    needs: [route, discover, prepare-release-tag, go-test]
    if: ${{ always() && !failure() && !cancelled() && needs.route.outputs.run_release == 'true' && (needs.discover.outputs.has_go != 'true' || needs.go-test.result == 'success') && (needs.prepare-release-tag.result == 'success' || needs.prepare-release-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize and tag
        id: export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare-release-tag.outputs.release_tag || github.ref_name }}"

          # Validate tag format against eligible release-tag policy
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "Error: Tag '$TAG' does not match eligible release tag policy (vX.Y.Z)." >&2
            exit 1
          }

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            exit 0
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "publish-tag" ]]; then
            if [[ "${{ github.ref_type }}" != "tag" ]]; then
              echo "Error: publish-tag mode invoked on a non-tag ref." >&2
              exit 1
            fi
            echo "Running in internal publisher mode; tag is immutable context."
            exit 0
          else
            git fetch --tags --force
            REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')

            if [[ -n "$REMOTE_TAG_SHA" ]]; then
              if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
                echo "Tag $TAG already exists on remote and points to the correct SHA. Continuing safely."
              else
                echo "Tag $TAG already exists on remote but points to a different commit ($REMOTE_TAG_SHA). Failing." >&2
                exit 1
              fi
            else
              git config --global user.name "github-actions[bot]"
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "$TAG" "${GITHUB_SHA}"
              git push origin "$TAG" || (
                VERIFY_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
                if [[ "$VERIFY_SHA" == "${GITHUB_SHA}" ]]; then
                  echo "Tag successfully verified on remote after push error."
                else
                  echo "Tag push failed and remote verification failed." >&2
                  exit 1
                fi
              )
            fi

            # Explicitly dispatch the publisher workflow at the new tag ref
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              gh workflow run "ci.yml" --ref "$TAG" -f mode="publish-tag"
            fi
          fi

  discover:
    name: Discover capabilities and cost profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_dart: ${{ steps.detect.outputs.has_dart }}
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
      has_qt_cpp: ${{ steps.detect.outputs.has_qt_cpp }}
      has_make_c: ${{ steps.detect.outputs.has_make_c }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
      has_goreleaser: ${{ steps.detect.outputs.has_goreleaser }}
      has_dart_or_flutter_tests: ${{ steps.detect.outputs.has_dart_or_flutter_tests
        }}
      has_packaging: ${{ steps.detect.outputs.has_packaging }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        shell: bash
        run: "set -euo pipefail\n# Keep this minimal: most language choices should\
          \ be decided at workflow install/customization time.\n# Runtime checks stay\
          \ for optional tests and packaging folders.\n\necho \"has_go=true\" >> \"\
          $GITHUB_OUTPUT\"\necho \"has_node=${EXPECT_NODE:-false}\" >> \"$GITHUB_OUTPUT\"\
          \necho \"has_dart=${EXPECT_DART:-false}\" >> \"$GITHUB_OUTPUT\"\necho \"\
          has_flutter=${EXPECT_FLUTTER:-false}\" >> \"$GITHUB_OUTPUT\"\necho \"has_qt_cpp=${EXPECT_QT_CPP:-false}\"\
          \ >> \"$GITHUB_OUTPUT\"\necho \"has_make_c=${EXPECT_MAKE_C:-false}\" >>\
          \ \"$GITHUB_OUTPUT\"\necho \"has_docker=${EXPECT_DOCKER:-false}\" >> \"\
          $GITHUB_OUTPUT\"\necho \"has_goreleaser=true\" >> \"$GITHUB_OUTPUT\"\n\n\
          ([[ -d test ]] || [[ -d tests ]] || [[ -f pubspec.yaml ]]) && echo \"has_dart_or_flutter_tests=true\"\
          \ >> \"$GITHUB_OUTPUT\" || echo \"has_dart_or_flutter_tests=false\" >> \"\
          $GITHUB_OUTPUT\"\n([[ -d packaging ]] || [[ -d pkg ]] || [[ -f debian/control\
          \ ]]) && echo \"has_packaging=true\" >> \"$GITHUB_OUTPUT\" || echo \"has_packaging=false\"\
          \ >> \"$GITHUB_OUTPUT\"          \n"
      - id: profile
        shell: bash
        run: "set -euo pipefail\n# repo visibility is authoritative\nif [[ \"${{ github.event.repository.private\
          \ }}\" == \"true\" ]]; then\n  echo \"profile=private\" >> \"$GITHUB_OUTPUT\"\
          \nelse\n  echo \"profile=public\" >> \"$GITHUB_OUTPUT\"\nfi          \n"
    needs:
      - route
  gitleaks:
    name: Secret scan
    needs:
      - route
      - discover
    if: ${{ needs.route.outputs.run_cleanup != 'true' && (needs.route.outputs.is_nightly
      == 'true' || needs.route.outputs.is_monthly == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  golangci:
    name: lint
    needs:
      - route
      - discover
    if: ${{ needs.discover.outputs.has_go == 'true' && needs.route.outputs.run_code_checks
      == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
  go-test:
    name: Go lint/test (${{ matrix.os }})
    needs:
      - route
      - discover
      - golangci
    if: ${{ needs.discover.outputs.has_go == 'true' && needs.route.outputs.run_code_checks
      == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./... -v
      - name: Check examples are up-to-date
        run: |
          if [[ -f examples/example.config ]]; then
            mkdir -p examples/.github/workflows
            go run cmd/generate/main.go generate workflows -input-file examples/example.config -output-dir examples/.github/workflows/ -force-date "2026-08-13 00:00:00 +0000 UTC"
            if ! git diff --quiet examples/; then
              echo "::error::Generated examples are out of sync. Please run 'go run cmd/generate/main.go generate workflows -input-file examples/example.config -output-dir examples/.github/workflows/ -force-date \"2026-08-13 00:00:00 +0000 UTC\"' and commit the changes."
              exit 1
            fi
          fi
      - name: Run actionlint on generated examples
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest examples/.github/workflows/*
  go-vet:
    name: Go vet
    needs:
      - route
      - discover
    if: ${{ needs.discover.outputs.has_go == 'true' && needs.route.outputs.run_code_checks
      == 'true' && needs.discover.outputs.profile == 'public' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
  go-fmt-pr:
    name: go fmt -> PR (manual dispatch)
    needs:
      - route
      - discover
    if: ${{ needs.discover.outputs.has_go == 'true' && github.event_name == 'workflow_dispatch'
      && inputs.mode == 'lint-fix' && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run go fmt
        run: go fmt ./...
      - name: Create PR if go fmt changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "set -euo pipefail\ngit diff --quiet && { echo \"No fmt changes\"; exit\
          \ 0; }\ngit config user.name \"github-actions[bot]\"\ngit config user.email\
          \ \"41898282+github-actions[bot]@users.noreply.github.com\"\nBRANCH=\"ci/gofmt/${{\
          \ github.run_id }}\"\ngit checkout -b \"$BRANCH\"\ngit add -A\ngit commit\
          \ -m \"ci: go fmt\"\ngit push origin \"$BRANCH\"\ngh pr create --title \"\
          ci: go fmt\" --body \"Automated go fmt from manual dispatch.\" --base main\
          \ --head \"$BRANCH\" --label \"ci-autofix\"          \n"
  autofix:
    name: Auto-format and open PR
    needs:
      - route
      - discover
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'lint-fix'
      && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go (if needed)
        if: ${{ needs.discover.outputs.has_go == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup Node (if needed)
        if: ${{ needs.discover.outputs.has_node == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Setup Dart/Flutter (if needed)
        if: ${{ needs.discover.outputs.has_dart == 'true' || needs.discover.outputs.has_flutter
          == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate examples
        if: ${{ needs.discover.outputs.has_go == 'true' }}
        run: |
          if [[ -f examples/example.config ]]; then
            mkdir -p examples/.github/workflows
            go run cmd/generate/main.go generate workflows -input-file examples/example.config -output-dir examples/.github/workflows/ -force-date "2026-08-13 00:00:00 +0000 UTC"
          fi
      - name: Run autofix formatters
        shell: bash
        run: "set -euo pipefail\nif [[ \"${{ needs.discover.outputs.has_go }}\" ==\
          \ \"true\" ]]; then\n  go fix ./... || true\n  go fmt ./... || true\nfi\n\
          if [[ \"${{ needs.discover.outputs.has_node }}\" == \"true\" ]]; then\n\
          \  npm ci || true\n  npx prettier . --write || true\nfi\nif [[ \"${{ needs.discover.outputs.has_dart\
          \ }}\" == \"true\" || \"${{ needs.discover.outputs.has_flutter }}\" == \"\
          true\" ]]; then\n  dart format . || true\nfi          \n"
      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nif git diff --quiet; then\n  echo \"No changes; exiting.\"\
          \n  exit 0\nfi\n\ngit config user.name \"github-actions[bot]\"\ngit config\
          \ user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\
          \nPARENT_PR=\"${{ github.event.pull_request.number || 'none' }}\"\nBRANCH=\"\
          ci/autofix/${{ github.run_id }}-parent-${PARENT_PR}\"\n\ngit checkout -b\
          \ \"$BRANCH\"\ngit add -A\ngit commit -m \"ci: automated formatting fixes\"\
          \ngit push origin \"$BRANCH\"\n\ngh pr create \\\n  --title \"ci: automated\
          \ formatting fixes\" \\\n  --body \"Automated formatting pass. Parent-PR:\
          \ ${PARENT_PR}\" \\\n  --base main \\\n  --head \"$BRANCH\" \\\n  --label\
          \ \"ci-autofix\"          \n"
  cleanup-autofix-prs:
    name: Cleanup autofix PRs on parent close
    needs:
      - route
    if: ${{ needs.route.outputs.run_cleanup == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_PR: ${{ github.event.pull_request.number }}
        run: "set -euo pipefail\ngh pr list --state open --search \"label:ci-autofix\
          \ in:title\" --json number,headRefName,body | \\\n  jq -r '.[] | select(.body\
          \ | contains(\"Parent-PR: '\"$PARENT_PR\"'\")) | [.number, .headRefName]\
          \ | @tsv' | \\\n  while IFS=$'\\t' read -r pr branch; do\n    gh pr close\
          \ \"$pr\" --comment \"Closing auto-fix PR because parent PR #$PARENT_PR\
          \ was closed.\"\n    git push origin --delete \"$branch\" || true\n  done\
          \          \n"
  goreleaser:
    name: GoReleaser
    needs: [route, discover, release-context]
    if: ${{ !failure() && !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.has_go == 'true' && needs.discover.outputs.has_goreleaser == 'true' && needs.route.outputs.run_release == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: 'release --clean ${{ (github.event_name == ''workflow_dispatch'' && inputs.mode == ''publish-tag'' && (contains(github.ref_name, ''-test'') || contains(github.ref_name, ''-rc'') || contains(github.ref_name, ''-alpha''))) && ''--snapshot'' || '''' }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.release-context.outputs.release_tag }}
